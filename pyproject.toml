[project]
name = "rapport"
version = "0.1.0"
description = "RAPPORT: relational-dynamics multimodal emotion recognition in conversation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "torchaudio",
    "transformers>=4.45",
    "peft>=0.13",
    "hydra-core",
    "omegaconf",
    "av",
    "soundfile",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "tensorboard",
    "pytest",
    "pyarrow>=24.0.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rapport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads the full cached feature set and fits a probe (run explicitly with `pytest -m slow`)",
]
