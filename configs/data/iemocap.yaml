# Phase N5-B (docs/PHASE_N5B.md, docs/RECIPE.md's IEMOCAP section).
# Processed/cached data lives under data_root (in-repo, gitignored, mirrors
# data/meld/'s layout). The raw release itself is NOT under data_root --
# it lives outside the repo at ~/data/iemocap/iemocap/IEMOCAP_full_release
# (scripts/preprocess_iemocap.py's --raw-dir default), too large to be
# repo-local; only derived processed/cache artifacts are.
name: iemocap
dataset: IEMOCAP
modalities: [text, audio, video]
data_root: ${paths.data_dir}/iemocap
num_classes: 6
label_map:
  angry: 0
  happy: 1
  excited: 2
  sad: 3
  neutral: 4
  frustrated: 5
